name: Keep Streamlit App Awake

on:
  schedule:
    # Corre a las 00:00, 11:00 y 22:00 UTC — gaps de 11h, 11h y 2h.
    # Streamlit Community Cloud duerme la app tras 12h sin trafico,
    # asi que ningun gap supera ese limite.
    - cron: '0 */11 * * *'
  workflow_dispatch: {}

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: pip install -r scripts/requirements-keepalive.txt

      - name: Visitar la app y despertarla si esta dormida
        env:
          STREAMLIT_APP_URL: https://portafolio-data-science-2026.streamlit.app
        run: python scripts/keep_streamlit_awake.py
